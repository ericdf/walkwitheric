name: Fetch Schedule & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/_data/schedule.json'
  schedule:
    - cron: '0 13 * * *'   # 6 AM PT (UTC-7 PDT)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch tour schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-schedule.js
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}

      - name: Build site
        run: npm run build

      - name: Commit updated schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/schedule.json
          git diff --staged --quiet || git commit -m "chore: refresh tour schedule [skip ci]" && git pull --rebase && git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
