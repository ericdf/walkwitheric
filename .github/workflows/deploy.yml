name: Fetch Schedule & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/_data/schedule.json'
  schedule:
    - cron: '0 13 * * *'   # 6 AM PT (UTC-7 PDT)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run mid-deploy; a newer run waits its turn instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
        with:
          # Scheduled/manual runs (and re-runs of them) build from the current
          # tip of main, not the SHA the run was originally created for.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch tour schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-schedule.js
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}

      - name: Build site
        run: npm run build

      - name: Commit updated schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/schedule.json
          git diff --staged --quiet || git commit -m "chore: refresh tour schedule [skip ci]" && git pull --rebase -X theirs && git push

      - uses: actions/configure-pages@v6

      # Name the artifact per attempt so a re-run never sees two artifacts
      # called "github-pages" (deploy-pages refuses to pick one).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

  # Deploy in a separate job (GitHub's recommended layout). The artifact
  # listing API lags behind uploads; querying it in the same job a fraction
  # of a second later intermittently returned "Found 0 artifact(s)".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v5
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
